name: android

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  sim-test:
    name: 逻辑仿真测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: node --test
        run: node --test sim/schedule.test.mjs sim/autopilot.test.mjs

  build-apk:
    name: 编译 debug APK
    runs-on: ubuntu-latest
    needs: sim-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK 且 licenses 已接受，不再调用 setup-android：
      # 它默认安装已被 Google 下架的 'tools' 包，会让 sdkmanager 以 exit 1 结束。
      - name: SDK 环境
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: assembleDebug
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 列出产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: jd-sniper-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
